<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sophy ♥ Max</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;
  font-family: "Noto Serif KR", serif;
  background: #e2f5c9;
  color: #333;
}

/* HERO */

.hero {
  width: 100%;
  margin: 0;
  padding: 0;
  background: #e2f5c9;
}

.hero-content {
  width: 100%;
  margin: 0;
  padding: 0;
}

.top-photo-placeholder {
  width: min(600px, 100vw);
  margin: 0 auto;
  padding: 0;
  line-height: 0;
  overflow: hidden;
}

.top-photo-placeholder img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
}

/* INVITATION */

.intro {
  max-width: 600px;
  margin: 0 auto;
  padding: 70px 25px 60px;
  text-align: center;
  background: #e2f5c9;
}

.section-title {
  margin: 0 0 35px;
  font-size: 28px;
  font-weight: 400;
  letter-spacing: 3px;
}

.message {
  margin: 0;
  line-height: 2;
  font-size: 15px;
}

.parents {
  margin-top: 35px;
  line-height: 2;
  font-size: 14px;
}

/* MOBILE */

@media (max-width: 600px) {

  .intro {
    padding: 55px 20px 50px;
  }

  .section-title {
    font-size: 25px;
  }

  .message {
    font-size: 14px;
  }

}

</style>
</head>

<body>

<!-- HERO -->

<section class="hero">

  <div class="hero-content">

    <div class="top-photo-placeholder">

      <img
        src="top-wedding-photo.jpg"
        alt="Sophy and Max wedding photo"
      >

    </div>

  </div>

</section>


<!-- INVITATION -->

<section class="intro">

  <h2 class="section-title">
    초대합니다
  </h2>

  <p class="message">
    둘이 하나가 되는 첫 날..<br>
    마음껏 기뻐하며 감사하는 자리에<br>
    여러분과 함께 하고자 합니다.<br><br>

    부디 오셔서 저희를 축복해 주세요.<br>
    그 축하를 평생 잊지않고 잘 살겠습니다.
  </p>

  <div class="parents">

    Cyrus · Narges 의 장남 Max<br>
    최래규 · 김정희 의 장녀 Sophy(경미)

  </div>

</section>


</body>
</html>
